<main class="page" dir="rtl">
  <header class="page-header">
    <h1>ניהול פניות</h1>
  </header>

  <app-request-statistics [statistics]="state.statistics()" />

  <app-request-filters (filtersChange)="state.setFilters($event)" />

  @if (state.selected(); as selected) {
    <app-request-details
      [request]="selected"
      [history]="state.history()"
      [historyLoading]="state.historyLoading()"
      [saving]="state.saving()"
      [message]="state.message()"
      (changeStatus)="state.updateStatus($event.newStatus, $event.userName)"
      (close)="state.clearSelection()" />
  }

  <section class="results">
    @if (state.error(); as message) {
      <div class="state error">
        <p>{{ message }}</p>
        <button type="button" (click)="state.reload()">נסו שוב</button>
      </div>
    } @else if (state.page(); as result) {
      @if (result.items.length === 0) {
        <div class="state empty">לא נמצאו פניות התואמות לחיפוש.</div>
      } @else {
        <app-requests-table
          [result]="result"
          [sortBy]="state.query().sortBy"
          [sortDirection]="state.query().sortDirection"
          [selectedId]="state.selectedId()"
          (sortChange)="state.setSort($event)"
          (pageChange)="state.setPage($event)"
          (pageSizeChange)="state.setPageSize($event)"
          (selectRequest)="state.select($event)" />
      }
    }

    @if (state.loading()) {
      <div class="loading">טוען...</div>
    }
  </section>
</main>
